trigger:
- main 

pool:
  vmImage: ubuntu-lates

stages:
  - stage: 'Docker Build'
    displayName: "Building Docker Image"
    jobs: 
      - job: 'Docker_Build'
        steps:
          - task: Docker@2
            inputs:
              containerRegistry: 'docker-svc'
              repository: 'demo'
              command: 'build'
              Dockerfile: '**/Dockerfile'
              tags: 'latest'

  - stage: 'Docker Push'
    displayName: 'Pushing docker image to ACR'
    jobs:
      - job: 'Docker_Push'
        steps:
          - task: Docker@2
            inputs:
              containerRegistry: 'docker-svc'
              repository: 'demo'
              command: 'push'
              tags: 'latest'
  - stage: 'Publish build artifacts'
    displayName: 'Publish Build Artifacts'
    jobs:
      - job: 'Publish_Artifacts'
        steps:
          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)'
              ArtifactName: 'drop'
              publishLocation: 'Container'